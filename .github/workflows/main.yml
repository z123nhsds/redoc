name: Publish Docker image
on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  dockerhub:
    name: Publish redoc image to DockerHub
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build_push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Docker meta
        id: docker_meta
        uses: crazy-max/ghaction-docker-meta@v1
        with:
          images: redocly/redoc

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build_push
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./config/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}

  slsa-provenance:
    name: Generate SLSA provenance
    needs: dockerhub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate SLSA provenance
        uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.10.0
        with:
          base64-subjects: ${{ needs.dockerhub.outputs.image-digest }}
          upload-assets: true
          provenance-name: redoc-docker-image.intoto.jsonl
