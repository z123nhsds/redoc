name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [webpack-build, ts-check]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.task }}
        run: |
          if [ "${{ matrix.task }}" = "webpack-build" ]; then
            npm run bundle
          elif [ "${{ matrix.task }}" = "ts-check" ]; then
            npm run ts-check
          fi

      - name: Upload build artifacts
        if: matrix.task == 'webpack-build'
        uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: bundles/
          retention-days: 1

  e2e-tests:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        browser: [chrome, firefox]
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: bundles
          path: bundles/

      - name: Cypress E2E tests - ${{ matrix.browser }} (shard ${{ matrix.shard }})
        uses: cypress-io/github-action@v6
        with:
          browser: ${{ matrix.browser }}
          start: npm run start:demo
          wait-on: 'http://localhost:8080'
          wait-on-timeout: 120
        env:
          CYPRESS_SHARD: ${{ matrix.shard }}

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.browser }}-${{ matrix.shard }}
          path: cypress/screenshots/

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-${{ matrix.browser }}-${{ matrix.shard }}
          path: cypress/videos/

  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
